name: Deploy Dev

on:
  push:
    tags:
      - 'deploy-dev'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd ~/henz-software

            git fetch origin

            git checkout --detach ${{ github.sha }}

            echo "Deployed commit:"
            git rev-parse HEAD